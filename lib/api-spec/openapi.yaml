openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/config:
    get:
      operationId: getGoogleAuthConfig
      summary: Get Google configuration and a short-lived login nonce
      responses:
        "200":
          description: Google login configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthConfig"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Read the verified Google session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/google:
    post:
      operationId: googleSignIn
      summary: Verify a Google ID token and create an HttpOnly session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredential"
      responses:
        "200":
          description: Verified session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credential or login nonce
        "403":
          description: Origin not authorized
  /auth/logout:
    post:
      operationId: logoutAuth
      summary: Clear the current browser session
      responses:
        "204":
          description: Signed out
  /photos/download:
    get:
      operationId: downloadEventPhoto
      summary: Download an allowlisted sample photo after Google sign-in
      parameters:
        - in: query
          name: file
          required: true
          schema:
            type: string
        - in: query
          name: eventId
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,100}$"
        - in: query
          name: photoId
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,100}$"
      responses:
        "200":
          description: Photo file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Google sign-in required
        "404":
          description: Photo not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    GoogleAuthConfig:
      type: object
      required: [clientId, nonce, allowedOrigins]
      properties:
        clientId:
          type: string
        nonce:
          type: string
        allowedOrigins:
          type: array
          items:
            type: string
    GoogleCredential:
      type: object
      required: [credential, nonce]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 16384
        nonce:
          type: string
          minLength: 32
          maxLength: 128
    AuthUser:
      type: object
      required: [id, provider, name, email, picture]
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [google]
        name:
          type: string
        email:
          type: string
          format: email
        picture:
          type: [string, "null"]
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

